<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stopur</title>
<body>


<h1>Mit ur</h1>

<h2 id="ur">0</h2>


<button onClick="startUr()">Start</button>
<button onclick="stopUr()">Stop</button>


<script>

let startTid;
let timerId = null;

function startUr() {

    if (timerId === null) {
        startTid = Date.now();


        timerId = setInterval(function() {
            let tidGaaet = Date.now() - startTid;
            document.getElementById("ur").innerHTML = "Tid i millisekunder: " + tidGaaet
        }, 10)
    }
}


function stopUr() {

    clearInterval(timerId);
    timerId = null;

}

</script>


</body>

</head>
</html>
